<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>황해담 활어 발주 계산기</title>
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --text:#1a1d21; --muted:#6b7280;
  --border:#d7dde3; --accent:#0b6e99; --accent-text:#ffffff;
  --red:#c62828; --red-bg:#fdecec; --red-border:#e57373;
  --green:#1b7a43; --green-bg:#e8f6ee; --green-border:#7bc99a;
  --yellow:#9a6b00; --yellow-bg:#fdf3d7; --yellow-border:#e0b84f;
  --input-bg:#ffffff; --sub:#8a929b;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12151a; --card:#1c2128; --text:#e7eaee; --muted:#98a2ad;
    --border:#39414b; --accent:#3d9dc9; --accent-text:#0d1216;
    --red:#ff8a80; --red-bg:#3b2223; --red-border:#7a3b3b;
    --green:#6fd598; --green-bg:#1e3327; --green-border:#3b6b4d;
    --yellow:#e8c15a; --yellow-bg:#38301b; --yellow-border:#6d5a2a;
    --input-bg:#141920; --sub:#7d8791;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5;padding-bottom:60px}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
button{font:inherit;cursor:pointer;min-height:44px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);padding:0 14px}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
button:active{opacity:.75}
input[type=number]{font-size:16px;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);color:var(--text);width:100%}
input:disabled{opacity:.6;background:transparent}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
header h1{font-size:1.25rem}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
/* 설정 패널 */
details.settings{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:14px}
details.settings>summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
details.settings>summary::-webkit-details-marker{display:none}
details.settings>summary:after{content:"▸";transition:.15s}
details.settings[open]>summary:after{transform:rotate(90deg)}
.set-body{padding:0 16px 16px;display:grid;gap:16px}
.set-group h3{font-size:.85rem;color:var(--muted);margin-bottom:8px;font-weight:600}
.set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.set-item{display:flex;flex-direction:column;gap:4px}
.set-item label{font-size:.85rem;color:var(--muted)}
.stepper{display:flex;gap:6px;align-items:stretch}
.stepper button{min-width:44px;font-size:1.2rem;padding:0}
.stepper input{text-align:center}
/* 요약 카드 */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-left:6px solid var(--border);border-radius:12px;padding:14px 16px}
.card.over{border-left-color:var(--red);background:var(--red-bg)}
.card.tight{border-left-color:var(--yellow-border);background:var(--yellow-bg)}
.card.ok{border-left-color:var(--green-border)}
.card h2{font-size:1rem;margin-bottom:2px}
.card .total{font-size:2.2rem;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.card .total small{font-size:1.1rem;font-weight:600;color:var(--muted)}
.card .per{margin-top:2px}
.card .per b.over{color:var(--red)}
.card .per b.tight{color:var(--yellow)}
.badge{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:20px;font-size:.85rem;font-weight:700}
.badge.over{background:var(--red);color:#fff}
.badge.ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.badge.tight{background:var(--yellow-bg);color:var(--yellow);border:1px solid var(--yellow-border)}
.card .need{margin-top:6px;font-size:.9rem;font-weight:700;color:var(--red)}
.card .warnrow{margin-top:6px;font-size:.85rem;color:var(--yellow);font-weight:600}
/* 상세 섹션 */
section.day{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;overflow:hidden}
section.day>.day-head{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between;padding:14px 16px 6px}
section.day h2{font-size:1.1rem}
section.day h2 span{color:var(--muted);font-weight:500;font-size:.9rem}
.tbl-scroll{overflow-x:auto;padding:0 8px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{border:1px solid var(--border);padding:6px 8px;text-align:center;font-size:.9rem;vertical-align:top}
th{background:var(--bg);font-weight:600;white-space:nowrap}
th .mul{display:block;font-size:.75rem;color:var(--accent);font-weight:700}
td.branch, tr.sumrow td:first-child{font-weight:700;background:var(--bg);white-space:nowrap}
td .adj{display:block;font-size:.78rem;color:var(--sub);margin-top:2px;white-space:nowrap}
td input{min-width:64px;text-align:center;padding:6px 4px}
tr.sumrow td{font-weight:700;background:var(--bg)}
td.subcell{font-weight:700;white-space:nowrap}
/* 기준 맞추기 / 카톡 */
.day-tools{padding:12px 16px 16px;display:grid;gap:12px}
.reduce-box{border:1px dashed var(--border);border-radius:10px;padding:12px;display:none}
.reduce-box.show{display:block}
.reduce-box h4{margin-bottom:6px}
.reduce-box .warn{color:var(--red);font-weight:700;margin:6px 0}
.reduce-box .info{color:var(--muted);font-size:.9rem}
.reduce-box table{min-width:0;margin:8px 0}
.reduce-actions{display:flex;gap:8px;margin-top:8px}
.kakao{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,monospace;font-size:.82rem;white-space:pre-wrap;word-break:break-all}
.kakao-row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.kakao-row h3{font-size:.9rem;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 20px;border-radius:24px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
#toast.show{opacity:1}
.copy-all{width:100%;margin-bottom:20px}
@media (max-width:600px){
  header{flex-direction:column;align-items:stretch}
  .hbtns button{flex:1}
  .card .total{font-size:2.6rem}
}
@media print{
  .hbtns,.no-print,button,details.settings,#toast,.kakao-wrap,.reduce-box{display:none !important}
  body{background:#fff;color:#000;padding:0}
  .card,section.day{border:1px solid #999;background:#fff;break-inside:avoid}
  table{min-width:0}
  th,td{border-color:#999}
  input{border:none;background:none}
  .tbl-scroll{overflow:visible}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>황해담 활어 발주 계산기</h1>
    <div class="hbtns no-print">
      <button class="primary" id="btnShare">공유 링크 복사</button>
      <button id="btnReset">초기화</button>
    </div>
  </header>


  <details class="settings no-print" id="settingsPanel" open>
    <summary>⚙️ 설정 (배수 · 인원)</summary>
    <div class="set-body">
      <div class="set-group">
        <h3>어종별 배수</h3>
        <div class="set-grid" id="mulGrid"></div>
      </div>
      <div class="set-group">
        <h3>기준값</h3>
        <div class="set-grid">
          <div class="set-item"><label>연어 환산계수 (1미 = ?kg)</label><input type="number" id="inConv" min="0" step="0.5"></div>
          <div class="set-item"><label>1인당 기준물량 (kg)</label><input type="number" id="inStd" min="0" step="10"></div>
        </div>
      </div>
      <div class="set-group">
        <h3>요일별 투입 인원</h3>
        <div class="set-grid" id="staffGrid"></div>
      </div>
    </div>
  </details>

  <div class="cards" id="cards"></div>
  <div id="days"></div>
  <button class="copy-all no-print" id="btnCopyAll">📋 전체 요일 카톡 텍스트 한번에 복사</button>
</div>
<div id="toast"></div>

<script>
/* ==CALC-START== */
var BRANCHES=['송파','중랑','논현','다산'];
var SPECIES=['광어','숭어','도다리','생새우','연어'];
var SHORT=['광어','숭어','도다리','새우'];
var DAYS=['평일','금요일','토요일','일요일'];
var DEFAULT={
  m:[1,1,2,4.5,0.5], c:7, s:100, p:[5,6,8,5],
  q:[
    [[30,50,13,8,2],[30,50,13,8,2],[18,35,8,6,2],[10,17,4,2,1]],
    [[40,100,17,20,3],[35,100,17,20,3],[25,45,12,10,2],[14,27,6,5,1]],
    [[45,110,20,20,3],[40,110,20,20,3],[25,45,15,14,2],[14,27,6,6,1]],
    [[35,60,15,12,2],[35,60,15,12,2],[18,35,8,7,2],[12,22,6,3,1]]
  ]
};
var state=null;

function fmt(x){
  var r=Math.round(x*10)/10;
  return (r%1===0)? String(Math.round(r)) : r.toFixed(1);
}
function fmtM(x){ return String(+(+x).toFixed(2)); }

function adjusted(d,b,s){
  var base=+state.q[d][b][s]||0, m=+state.m[s]||0;
  if(s===4) return base*m*(+state.c||0);
  return base*m;
}
function salmonMi(d,b){ return (+state.q[d][b][4]||0)*(+state.m[4]||0); }

function calcDay(d){
  var subs=[],spTot=[0,0,0,0,0],total=0,b,s,v,sub;
  for(b=0;b<4;b++){
    sub=0;
    for(s=0;s<5;s++){ v=adjusted(d,b,s); sub+=v; spTot[s]+=v; }
    subs.push(sub); total+=sub;
  }
  var staff=Math.max(0,+state.p[d]||0);
  var std=+state.s||0;
  var cap=staff*std;
  var per=(staff>0&&std>0)? total/staff : null;
  var excess=total-cap;
  var needed=std>0? Math.ceil(total/std) : 0;
  var status='ok';
  if(staff<=0||std<=0) status='nostaff';
  else if(per>std) status='over';
  else if(per>=std*0.9) status='tight';
  return {subs:subs,spTot:spTot,total:total,staff:staff,cap:cap,per:per,excess:excess,needed:needed,status:status};
}

/* 삭감 시뮬레이션: 중랑(index 1)만, 연어 제외 비례 삭감 */
function reductionPlan(d){
  var c=calcDay(d);
  if(c.status==='nostaff') return {type:'nostaff'};
  if(c.excess<=0) return {type:'none',c:c};
  var salmonKg=adjusted(d,1,4);
  var nonSalmon=c.subs[1]-salmonKg;
  if(nonSalmon<=0||c.excess>=nonSalmon) return {type:'impossible',c:c};
  var r=(nonSalmon-c.excess)/nonSalmon;
  var newBases=state.q[d][1].map(function(v,s){ return s===4? +v : (+v)*r; });
  var newSub=nonSalmon*r+salmonKg;
  var rate=c.excess/c.subs[1]*100;
  return {type:'ok',r:r,newBases:newBases,newSub:newSub,rate:rate,c:c};
}

function encodeState(st){
  var j=JSON.stringify([st.m,st.c,st.s,st.p,st.q]);
  return btoa(j).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeState(str){
  try{
    var j=atob(String(str).replace(/-/g,'+').replace(/_/g,'/'));
    var a=JSON.parse(j);
    if(!a||a.length<5) return null;
    var m=a[0],pp=a[3],q=a[4];
    if(!m||m.length!==5||!pp||pp.length!==4||!q||q.length!==4) return null;
    for(var d=0;d<4;d++){
      if(!q[d]||q[d].length!==4) return null;
      for(var b=0;b<4;b++){ if(!q[d][b]||q[d][b].length!==5) return null; }
    }
    return {m:m,c:a[1],s:a[2],p:pp,q:q};
  }catch(e){ return null; }
}
/* ==CALC-END== */


function hashParams(){ return new URLSearchParams(location.hash.replace(/^#/,'')); }

function loadState(){
  var p=hashParams();
  var d=p.get('d');
  if(d){ var st=decodeState(d); if(st) return st; }
  try{
    var ls=localStorage.getItem('hwal-state');
    if(ls){ var a=JSON.parse(ls); if(a&&a.q&&a.q.length===4) return a; }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT));
}

function persist(){
  try{ localStorage.setItem('hwal-state',JSON.stringify(state)); }catch(e){}
  var p=new URLSearchParams();
  p.set('d',encodeState(state));
  try{ history.replaceState(null,'','#'+p.toString()); }catch(e){}
}

function shareUrl(){
  var p=new URLSearchParams();
  p.set('d',encodeState(state));
  return location.href.split('#')[0]+'#'+p.toString();
}

function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._tm);
  t._tm=setTimeout(function(){ t.classList.remove('show'); },1800);
}

function copyText(txt,msg){
  function done(){ toast(msg||'복사됨'); }
  function fallback(){
    var ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand('copy'); done(); }
    catch(e){ toast('복사 실패 — 길게 눌러 직접 복사해 주세요'); }
    ta.remove();
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done,fallback);
  }else fallback();
}

function dayDateLabel(d){
  if(d===0) return '평일';
  var dowMap={1:5,2:6,3:0};
  var t=new Date();
  var diff=(dowMap[d]-t.getDay()+7)%7;
  t.setDate(t.getDate()+diff);
  return (t.getMonth()+1)+'/'+t.getDate()+' '+DAYS[d];
}

function kakaoText(d){
  var c=calcDay(d);
  var lines=[];
  lines.push('['+dayDateLabel(d)+' 예상물량 — '+fmt(c.total)+'kg]');
  var crit=SPECIES.map(function(n,s){ return n+' ×'+fmtM(state.m[s]); }).join(' / ');
  lines.push('※ 기준: '+crit+' (1미='+fmtM(state.c)+'kg)');
  for(var b=0;b<4;b++){
    var parts=[];
    for(var s=0;s<4;s++) parts.push(SHORT[s]+fmt(adjusted(d,b,s)));
    parts.push('연어'+fmt(salmonMi(d,b))+'미');
    lines.push(BRANCHES[b]+' '+fmt(c.subs[b])+'kg — '+parts.join(' / '));
  }
  return lines.join('\n');
}

/* ---------- UI 구성 (최초 1회) ---------- */
function buildUI(){
  var i,d,b,s,html;

  html='';
  for(i=0;i<5;i++){
    html+='<div class="set-item"><label>'+SPECIES[i]+' 배수</label>'+
      '<div class="stepper">'+
      '<button type="button" class="mstep" data-i="'+i+'" data-dir="-1">−</button>'+
      '<input type="number" class="mul-in" data-i="'+i+'" min="0" step="0.5">'+
      '<button type="button" class="mstep" data-i="'+i+'" data-dir="1">＋</button>'+
      '</div></div>';
  }
  document.getElementById('mulGrid').innerHTML=html;

  html='';
  for(d=0;d<4;d++){
    html+='<div class="set-item"><label>'+DAYS[d]+' 인원 (명)</label>'+
      '<input type="number" class="staff-in" data-d="'+d+'" min="0" step="1"></div>';
  }
  document.getElementById('staffGrid').innerHTML=html;

  html='';
  for(d=0;d<4;d++){
    html+='<div class="card" id="card-'+d+'">'+
      '<h2>'+DAYS[d]+'</h2>'+
      '<div class="total"><span id="ctot-'+d+'">0</span><small>kg</small></div>'+
      '<div class="per" id="cper-'+d+'"></div>'+
      '<div id="cbadge-'+d+'"></div>'+
      '<div class="need" id="cneed-'+d+'"></div>'+
      '</div>';
  }
  document.getElementById('cards').innerHTML=html;

  html='';
  for(d=0;d<4;d++){
    var thead='<tr><th>지점</th>';
    for(s=0;s<5;s++){
      thead+='<th>'+SPECIES[s]+(s===4?' (미)':'')+'<span class="mul" id="thm-'+d+'-'+s+'"></span></th>';
    }
    thead+='<th>소계(kg)</th></tr>';
    var rows='';
    for(b=0;b<4;b++){
      rows+='<tr><td class="branch">'+BRANCHES[b]+'</td>';
      for(s=0;s<5;s++){
        rows+='<td><input type="number" class="q-in" data-d="'+d+'" data-b="'+b+'" data-s="'+s+'" min="0" step="'+(s===4?1:1)+'">'+
          '<span class="adj" id="adj-'+d+'-'+b+'-'+s+'"></span></td>';
      }
      rows+='<td class="subcell" id="sub-'+d+'-'+b+'"></td></tr>';
    }
    rows+='<tr class="sumrow"><td>합계</td>';
    for(s=0;s<5;s++) rows+='<td id="spt-'+d+'-'+s+'"></td>';
    rows+='<td id="dtot-'+d+'"></td></tr>';

    html+='<section class="day" id="day-'+d+'">'+
      '<div class="day-head"><h2>'+DAYS[d]+' 상세 <span id="dhead-'+d+'"></span></h2>'+
      '<button type="button" class="reduce-btn no-print" data-d="'+d+'">⚖️ 기준 맞추기</button></div>'+
      '<div class="tbl-scroll"><table>'+thead+rows+'</table></div>'+
      '<div class="day-tools">'+
      '<div class="reduce-box" id="rbox-'+d+'"></div>'+
      '<div class="kakao-wrap no-print">'+
      '<div class="kakao-row"><h3>💬 카톡 복붙 텍스트</h3>'+
      '<button type="button" class="kakao-copy" data-d="'+d+'">복사</button></div>'+
      '<div class="kakao" id="kakao-'+d+'"></div>'+
      '</div></div></section>';
  }
  document.getElementById('days').innerHTML=html;
}

/* state → 입력칸 값 반영 */
function syncInputs(){
  document.querySelectorAll('.mul-in').forEach(function(el){ el.value=fmtM(state.m[+el.dataset.i]); });
  document.getElementById('inConv').value=fmtM(state.c);
  document.getElementById('inStd').value=fmtM(state.s);
  document.querySelectorAll('.staff-in').forEach(function(el){ el.value=state.p[+el.dataset.d]; });
  document.querySelectorAll('.q-in').forEach(function(el){
    el.value=fmtM(state.q[+el.dataset.d][+el.dataset.b][+el.dataset.s]);
  });
}


/* 계산 결과 → 화면 반영 */
function update(){
  for(var d=0;d<4;d++){
    var c=calcDay(d);
    var card=document.getElementById('card-'+d);
    card.className='card '+(c.status==='nostaff'?'':c.status);
    document.getElementById('ctot-'+d).textContent=fmt(c.total);

    var perEl=document.getElementById('cper-'+d);
    var badgeEl=document.getElementById('cbadge-'+d);
    var needEl=document.getElementById('cneed-'+d);
    if(c.status==='nostaff'){
      perEl.innerHTML='<b style="color:var(--red)">인원 입력 필요</b>';
      badgeEl.innerHTML=''; needEl.textContent='';
    }else{
      perEl.innerHTML=c.staff+'명 · 1인당 <b class="'+c.status+'">'+fmt(c.per)+'kg</b>';
      if(c.status==='over'){
        badgeEl.innerHTML='<span class="badge over">상한 '+fmt(c.cap)+'kg · '+fmt(c.excess)+'kg 초과</span>';
        var add=c.needed-c.staff;
        needEl.textContent='기준 충족까지 '+c.needed+'명 필요 ('+add+'명 추가)';
      }else if(c.status==='tight'){
        badgeEl.innerHTML='<span class="badge tight">상한 '+fmt(c.cap)+'kg · 여유 없음 ('+fmt(-c.excess)+'kg)</span>';
        needEl.textContent='';
      }else{
        badgeEl.innerHTML='<span class="badge ok">상한 '+fmt(c.cap)+'kg · '+fmt(-c.excess)+'kg 여유</span>';
        needEl.textContent='';
      }
    }

    document.getElementById('dhead-'+d).textContent='총 '+fmt(c.total)+'kg';

    for(var b=0;b<4;b++){
      for(var s=0;s<5;s++){
        var el=document.getElementById('adj-'+d+'-'+b+'-'+s);
        if(s===4){
          el.textContent='→ '+fmt(salmonMi(d,b))+'미 ('+fmt(adjusted(d,b,4))+'kg)';
        }else{
          el.textContent='→ '+fmt(adjusted(d,b,s))+'kg';
        }
      }
      document.getElementById('sub-'+d+'-'+b).textContent=fmt(c.subs[b]);
    }
    for(var s2=0;s2<5;s2++){
      var tEl=document.getElementById('spt-'+d+'-'+s2);
      if(s2===4){
        var miT=0; for(var b2=0;b2<4;b2++) miT+=salmonMi(d,b2);
        tEl.textContent=fmt(miT)+'미 ('+fmt(c.spTot[4])+'kg)';
      }else tEl.textContent=fmt(c.spTot[s2])+'kg';
      document.getElementById('thm-'+d+'-'+s2).textContent='×'+fmtM(state.m[s2]);
    }
    document.getElementById('dtot-'+d).textContent=fmt(c.total)+'kg';

    document.getElementById('kakao-'+d).textContent=kakaoText(d);
  }
}

/* ---------- 기준 맞추기 ---------- */
function showReduce(d){
  var box=document.getElementById('rbox-'+d);
  var plan=reductionPlan(d);
  var html='';
  if(plan.type==='nostaff'){
    html='<h4>⚖️ 기준 맞추기</h4><div class="info">인원을 먼저 입력해 주세요.</div>';
  }else if(plan.type==='none'){
    html='<h4>⚖️ 기준 맞추기</h4><div class="info">✅ 조정 불필요 — 현재 물량('+fmt(plan.c.total)+'kg)이 상한('+fmt(plan.c.cap)+'kg) 이내입니다.</div>';
  }else if(plan.type==='impossible'){
    var add=plan.c.needed-plan.c.staff;
    html='<h4>⚖️ 기준 맞추기</h4>'+
      '<div class="warn">⚠ 중랑 물량을 전부 빼도 기준을 맞출 수 없습니다.</div>'+
      '<div class="warn">인원 '+add+'명 추가 필요 (현재 '+plan.c.staff+'명 → 필요 '+plan.c.needed+'명)</div>';
  }else{
    var t='<table><tr><th>어종</th>';
    for(var s=0;s<5;s++) t+='<th>'+SPECIES[s]+'</th>';
    t+='</tr><tr><td>현재</td>';
    for(s=0;s<5;s++) t+='<td>'+fmtM(state.q[d][1][s])+(s===4?'미':'')+'</td>';
    t+='</tr><tr><td><b>삭감 후</b></td>';
    for(s=0;s<5;s++) t+='<td><b>'+fmt(plan.newBases[s])+(s===4?'미':'')+'</b></td>';
    t+='</tr></table>';
    html='<h4>⚖️ 기준 맞추기 — 중랑만 비례 삭감 (연어 제외)</h4>'+
      '<div class="info">초과 '+fmt(plan.c.excess)+'kg → 중랑 소계 '+fmt(plan.c.subs[1])+'kg → <b>'+fmt(plan.newSub)+'kg</b> (삭감률 '+fmt(plan.rate)+'%)</div>'+
      '<div class="info">※ 송파·논현·다산은 삭감하지 않습니다.</div>'+t;
    if(plan.rate>30){
      html+='<div class="warn">⚠ 중랑 삭감률 '+fmt(plan.rate)+'% — 조기 품절이 아니라 저녁 영업이 어려운 수준입니다.</div>';
    }
    html+='<div class="reduce-actions"><button type="button" class="primary reduce-apply" data-d="'+d+'">적용</button>'+
      '<button type="button" class="reduce-cancel" data-d="'+d+'">취소</button></div>';
  }
  if(plan.type!=='ok'){
    html+='<div class="reduce-actions"><button type="button" class="reduce-cancel" data-d="'+d+'">닫기</button></div>';
  }
  box.innerHTML=html;
  box.classList.add('show');
}

function applyReduce(d){
  var plan=reductionPlan(d);
  if(plan.type!=='ok') return;
  for(var s=0;s<4;s++) state.q[d][1][s]=plan.newBases[s];
  document.getElementById('rbox-'+d).classList.remove('show');
  syncInputs(); update(); persist();
  toast(DAYS[d]+' 중랑 물량 삭감 적용됨');
}

/* ---------- 이벤트 ---------- */
function onNumInput(el,setter){
  var v=parseFloat(el.value);
  if(isNaN(v)) v=0;
  if(v<0){ v=0; el.value=0; }
  setter(v);
  update(); persist();
}

function bindEvents(){
  document.body.addEventListener('input',function(e){
    var el=e.target;
    if(el.classList.contains('mul-in')) onNumInput(el,function(v){ state.m[+el.dataset.i]=v; });
    else if(el.id==='inConv') onNumInput(el,function(v){ state.c=v; });
    else if(el.id==='inStd') onNumInput(el,function(v){ state.s=v; });
    else if(el.classList.contains('staff-in')) onNumInput(el,function(v){ state.p[+el.dataset.d]=Math.floor(v); });
    else if(el.classList.contains('q-in')) onNumInput(el,function(v){ state.q[+el.dataset.d][+el.dataset.b][+el.dataset.s]=v; });
  });

  document.body.addEventListener('click',function(e){
    var el=e.target.closest('button');
    if(!el||el.disabled) return;
    if(el.classList.contains('mstep')){
      var i=+el.dataset.i;
      var nv=Math.max(0, Math.round(((+state.m[i]||0)+0.5*(+el.dataset.dir))*100)/100);
      state.m[i]=nv;
      syncInputs(); update(); persist();
    }
    else if(el.classList.contains('reduce-btn')) showReduce(+el.dataset.d);
    else if(el.classList.contains('reduce-apply')) applyReduce(+el.dataset.d);
    else if(el.classList.contains('reduce-cancel')) document.getElementById('rbox-'+el.dataset.d).classList.remove('show');
    else if(el.classList.contains('kakao-copy')) copyText(kakaoText(+el.dataset.d),DAYS[+el.dataset.d]+' 텍스트 복사됨');
    else if(el.id==='btnCopyAll'){
      var all=[0,1,2,3].map(kakaoText).join('\n\n');
      copyText(all,'전체 요일 텍스트 복사됨');
    }
    else if(el.id==='btnShare') copyText(shareUrl(),'공유 링크 복사됨');
    else if(el.id==='btnReset'){
      if(confirm('모든 값을 기본값으로 되돌릴까요?')){
        state=JSON.parse(JSON.stringify(DEFAULT));
        syncInputs(); update(); persist();
        toast('초기화됨');
      }
    }
  });
}

/* ---------- 시작 ---------- */
state=loadState();
buildUI();
syncInputs();
update();
bindEvents();
persist();
</script>
</body>
</html>
